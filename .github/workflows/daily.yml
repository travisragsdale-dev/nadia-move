name: Daily listings

on:
  schedule:
    - cron: "44 12 * * *"   # about 7:44–8:44 am New York time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape only, don't save or email"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-listings
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.0.6
      - name: Pull listings
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: https://vvwecchcqgdrxgyznhgl.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python pipeline/daily.py ${{ inputs.dry_run && '--dry-run' || '' }}

<div id="app">
  <div class="banner" id="offline" hidden>Can't reach the database right now. Check your connection and reload.</div>
  <header class="top">
    <div class="brand">
      <span class="bullet" aria-hidden="true">M</span>
      <h1><span id="appTitle">NYC Move</span><small id="subtitle">Apartment search + step-by-step guides</small></h1>
    </div>
    <div class="spacer"></div>
    <div class="who" id="who" aria-label="People here"></div>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <main>
    <section class="view pad" id="view-home" aria-label="Home">
      <div class="wrap" id="homeEl"></div>
    </section>

    <section class="view" id="view-search" hidden aria-label="Search">
      <div id="map" role="application" aria-label="Map of listings"></div>
      <div class="view pad" id="listView" hidden style="top:58px">
        <div class="wrap">
          <div class="listtools">
            <span class="muted" id="listCount"></span>
            <label class="muted" style="display:flex;gap:8px;align-items:center">Sort
              <select id="sortSel">
                <option value="new">Newest</option>
                <option value="price">Price, low to high</option>
                <option value="work">Shortest commute</option>
              </select>
            </label>
          </div>
          <div class="lst" id="listEl"></div>
        </div>
      </div>
      <div class="searchbar">
        <div class="seg" role="group" aria-label="View as">
          <button id="modeMap" aria-pressed="true">Map</button>
          <button id="modeList" aria-pressed="false">List</button>
        </div>
        <button class="chipbtn" id="filterBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filters <span class="n" id="filterN" hidden></span>
        </button>
      </div>
      <div class="mapnote" id="mapNote" hidden></div>
      <button class="fab" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add listing
      </button>
    </section>

    <section class="view pad" id="view-shortlist" hidden aria-label="Shortlist">
      <div class="wrap" id="shortEl"></div>
    </section>

    <section class="view pad" id="view-steps" hidden aria-label="All steps">
      <div class="wrap" id="stepsEl"></div>
    </section>

    <section class="view pad" id="view-guides" hidden aria-label="Guides">
      <div class="wrap" id="guidesEl"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-home" aria-selected="true" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="9" rx="1.5"/><rect x="13" y="4" width="7" height="5" rx="1.5"/><rect x="13" y="11" width="7" height="9" rx="1.5"/><rect x="4" y="15" width="7" height="5" rx="1.5"/></svg>Home
    </button>
    <button role="tab" id="tab-search" aria-selected="false" data-view="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Search
    </button>
    <button role="tab" id="tab-shortlist" aria-selected="false" data-view="shortlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg>Shortlist
      <span class="count" id="shortN" hidden></span>
    </button>
    <button role="tab" id="tab-guides" aria-selected="false" data-view="guides">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11a3 3 0 0 1 3 3v12H7a3 3 0 0 1-3-3V5Z"/><path d="M8 10h6M8 14h4"/></svg>Guides
    </button>
  </nav>
</div>

<div id="layer"></div>
<div class="toast" id="toast" hidden role="status"></div>
